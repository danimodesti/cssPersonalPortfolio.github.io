<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Danielle Modesti">
    <meta name="keywords" content="website, project, html, personal">
    <meta name="description" content="This is a practical HTML activity in which I create a multiple page website using pure HTML.">
    <title>Basic HTML Website - Contact</title>
</head>
<body>
    <header>
        <div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/50/Black_colour.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Website logo" width="100">
            <span>Danielle Modesti</span>
        </div>
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="#">Contact</a></li>
            </ul> 
        </nav>
        <h1>Contact</h1>
        <p>Please, fill out the form below and I'll get back to you ASAP.</p>
    </header>
    <main>
        <form action="https://httpbin.org/get" method="get">
            <p>
                <label for="name">Name:</label>
                <br>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">E-mail:</label>
                <br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="subject">Subject:</label>
                <br>
                <input type="text" id="subject" name="subject" required>
            </p>
            <p>
                <label for="message">Message:</label>
                <br>
                <textarea required id="message" name="message" rows="10" cols="30"></textarea>
            </p>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
       <p>&copy; all rights reserved <time datetime="2026">2026</time></p>
    </footer>
</body>
</html>
